services:
  - type: web
    name: browserless
    runtime: node
    plan: standard  # Requires at least standard for Chrome memory
    buildCommand: npm install && npx playwright-core install --with-deps chrome && npm run build
    startCommand: npm run start:prod
    envVars:
      - key: NODE_ENV
        value: production
      - key: DEBUG
        value: "browserless.io:*"
